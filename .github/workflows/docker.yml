name: Docker

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      paseo_version:
        description: "Expected source version to build. Required when publish is true."
        required: false
        default: ""
      publish:
        description: "Publish the image to GHCR. Manual publishes require paseo_version."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_latest:
        description: "Also publish ghcr.io/getpaseo/paseo:latest. Ignored for prereleases."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  setup:
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    outputs:
      image: ${{ steps.values.outputs.image }}
      install_version: ${{ steps.values.outputs.install_version }}
      publish: ${{ steps.values.outputs.publish }}
      check_tag: ${{ steps.values.outputs.check_tag }}
      publish_tags: ${{ steps.values.outputs.publish_tags }}
    steps:
      - uses: actions/checkout@v6

      - id: values
        env:
          INPUT_PASEO_VERSION: ${{ inputs.paseo_version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/paseo"
          package_version="$(node -p "require('./package.json').version")"
          install_version="${INPUT_PASEO_VERSION:-${package_version}}"
          publish=false
          publish_latest=false
          prerelease=false

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            install_version="${REF_NAME#v}"
            publish=true
            if [[ "${REF_NAME}" == *-* ]]; then
              prerelease=true
            else
              publish_latest=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${INPUT_PUBLISH:-false}" == "true" ]]; then
              if [[ -z "${INPUT_PASEO_VERSION}" || "${INPUT_PASEO_VERSION}" == "latest" ]]; then
                echo "::error::paseo_version is required for manual OCI image publishes."
                exit 1
              fi
              publish=true
            fi

            if [[ "${install_version}" == *-* ]]; then
              prerelease=true
            fi

            if [[ "${INPUT_PUBLISH_LATEST:-false}" == "true" && "${prerelease}" != "true" ]]; then
              publish_latest=true
            fi
          fi

          check_tag="${image}:check-${GITHUB_SHA::12}"
          publish_tags="${image}:${install_version}"
          if [[ "${publish_latest}" == "true" ]]; then
            publish_tags="${publish_tags}"$'\n'"${image}:latest"
          fi

          {
            echo "image=${image}"
            echo "install_version=${install_version}"
            echo "publish=${publish}"
            echo "check_tag=${check_tag}"
            echo "publish_tags<<EOF"
            echo "${publish_tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image=${image} install_version=${install_version} publish=${publish}"

  build:
    needs: setup
    if: needs.setup.outputs.publish != 'true'
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build multi-arch OCI image with Podman
        env:
          CHECK_TAG: ${{ needs.setup.outputs.check_tag }}
          PASEO_VERSION: ${{ needs.setup.outputs.install_version }}
        shell: bash
        run: |
          set -euo pipefail
          podman build \
            --platform "${PLATFORMS}" \
            --manifest "${CHECK_TAG}" \
            --build-arg "PASEO_VERSION=${PASEO_VERSION}" \
            --file docker/base/Dockerfile \
            .

      - name: Remove local check manifest
        if: always()
        env:
          CHECK_TAG: ${{ needs.setup.outputs.check_tag }}
        run: podman manifest rm "${CHECK_TAG}" >/dev/null 2>&1 || true

  publish:
    needs: setup
    if: needs.setup.outputs.publish == 'true'
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR with Podman
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | podman login "${REGISTRY}" --username "${{ github.actor }}" --password-stdin

      - name: Build and publish multi-arch OCI image with Podman
        env:
          PUBLISH_TAGS: ${{ needs.setup.outputs.publish_tags }}
          PASEO_VERSION: ${{ needs.setup.outputs.install_version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags <<< "${PUBLISH_TAGS}"
          primary="${tags[0]:-}"
          test -n "${primary}"

          podman build \
            --platform "${PLATFORMS}" \
            --manifest "${primary}" \
            --build-arg "PASEO_VERSION=${PASEO_VERSION}" \
            --file docker/base/Dockerfile \
            .

          for tag in "${tags[@]}"; do
            test -n "${tag}" || continue
            podman manifest push --all "${primary}" "docker://${tag}"
          done

      - name: Remove local publish manifest
        if: always()
        env:
          PUBLISH_TAGS: ${{ needs.setup.outputs.publish_tags }}
        shell: bash
        run: |
          mapfile -t tags <<< "${PUBLISH_TAGS}"
          primary="${tags[0]:-}"
          if [[ -n "${primary}" ]]; then
            podman manifest rm "${primary}" >/dev/null 2>&1 || true
          fi
