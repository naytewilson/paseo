name: ANVIL Dispatch Capability Canary
run-name: ANVIL dispatch canary ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact workflow commit to verify before any work
        required: true
        type: string
      request_id:
        description: Controller dispatch receipt correlation
        required: true
        type: string

permissions: {}

concurrency:
  group: dispatch-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  proof:
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    timeout-minutes: 3
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Verify actual manual dispatch without production changes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          printf 'DISPATCH_CANARY_PASS request_id=%s head_sha=%s run_id=%s\n' "$REQUEST_ID" "$GITHUB_SHA" "$GITHUB_RUN_ID"
          hostname
          id -un
