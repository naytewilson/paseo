name: Paseo Runner Reachability Probe

on:
  push:
    branches:
      - validation/paseo-runner-probe-20260928

permissions:
  contents: read

jobs:
  probe:
    name: read-only ANVIL node status
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    timeout-minutes: 10
    steps:
      - name: Query Dell and HP read-only status surfaces
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            url="$2"
            tmp="$RUNNER_TEMP/$label-status.json"
            echo "== $label =="
            code="$(curl -sS -o "$tmp" -w '%{http_code}' --connect-timeout 5 --max-time 10 "$url/status" || true)"
            echo "http_status=$code"
            if [[ "$code" != "200" ]]; then
              return 0
            fi
            LABEL="$label" FILE="$tmp" node <<'NODE'
          const fs = require("node:fs");
          const s = JSON.parse(fs.readFileSync(process.env.FILE, "utf8"));
          const out = {
            label: process.env.LABEL,
            schema: s.status_schema_version ?? null,
            node: s.node ?? null,
            tailscale: s.tailscale ?? null,
            scheduler: {
              active: s.scheduler?.active ?? null,
              lanes: s.scheduler?.lanes ?? null,
            },
            guardian: {
              admission_paused: s.guardian?.admission_paused ?? null,
              action: s.guardian?.action ?? null,
              disk_root_pct_free: s.guardian?.disk_root_pct_free ?? null,
            },
            health: {
              load_1m: s.health?.load_1m ?? null,
              mem_avail_mb: s.health?.mem_avail_mb ?? null,
              swap_used_mb: s.health?.swap_used_mb ?? null,
              disk_ssd_free_mb: s.health?.disk_ssd_free_mb ?? null,
              disk_hdd_free_mb: s.health?.disk_hdd_free_mb ?? null,
              data_mounted: s.health?.data_mounted ?? null,
            },
            official_task: s.current_work?.official?.task_id ?? null,
          };
          console.log(JSON.stringify(out, null, 2));
          NODE
          }
          probe dell http://100.121.148.16:18789
          probe hp http://100.110.137.51:18789
