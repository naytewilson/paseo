name: Paseo Exact-Ref Code Quality

on:
  push:
    branches:
      - validation/paseo-runner-probe-20260928

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CANDIDATE_SHA: 3417374599bfd149d1c142082ba9e54f6c5a6488
  BASE_SHA: c67b7158b441bb09026b38d86ae335cc4b49190a

jobs:
  quality:
    name: exact-ref format + lint
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Prove exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          node --version
          npm --version

      - name: Prove lockfile and install with isolated modern npm
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          test "$(git hash-object package-lock.json)" = "76664bdce86717ebccf78017b1863233bc4f70f7"
          npx -y npm@10.9.3 ci

      - name: Format-check changed source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$CANDIDATE_SHA")
          npm run format:check:files -- "${changed[@]}"

      - name: Lint changed JS/TS source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t lintable < <(git diff --name-only "$BASE_SHA...$CANDIDATE_SHA" | grep -E '\.(js|jsx|mjs|cjs|ts|tsx)$' || true)
          if (("${#lintable[@]}" > 0)); then
            npx oxlint "${lintable[@]}"
          fi
