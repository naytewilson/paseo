name: Paseo Runner Reachability Probe

on:
  push:
    branches:
      - validation/paseo-runner-probe-20260928

permissions:
  contents: read

jobs:
  probe:
    name: read-only live Paseo snapshot
    runs-on: [self-hosted, Linux, X64, nayte-linux]
    timeout-minutes: 10
    steps:
      - name: Observe live Dell Paseo process provenance
        shell: bash
        run: |
          set -u
          echo "== host =="
          hostname
          id

          echo "== Paseo processes =="
          ps -eo user=,pid=,comm= | grep -E 'Paseo (Supervisor|Daemon)' || true

          echo "== process filesystem/cgroup provenance =="
          for pid in $(ps -eo pid=,comm= | awk '$2=="Paseo" {print $1}'); do
            :
          done
          for pid in $(ps -eo user=,pid=,comm= | awk '$1=="nayte" && ($3=="Paseo" || $3=="Paseo Supervisor" || $3=="Paseo Daemon") {print $2}'); do
            echo "-- pid=$pid --"
            printf 'exe='; readlink "/proc/$pid/exe" 2>&1 || true
            printf 'cwd='; readlink "/proc/$pid/cwd" 2>&1 || true
            printf 'cgroup='; tr '\n' ';' < "/proc/$pid/cgroup" 2>/dev/null || true; echo
          done

          echo "== cgroup matches for live Paseo pids =="
          for pid in $(pgrep -u nayte -f 'Paseo' 2>/dev/null || true); do
            comm="$(cat "/proc/$pid/comm" 2>/dev/null || true)"
            case "$comm" in
              *Paseo*)
                printf 'pid=%s comm=%s cgroup=' "$pid" "$comm"
                tr '\n' ';' < "/proc/$pid/cgroup" 2>/dev/null || true
                echo
                ;;
            esac
          done

          echo "== user manager metadata =="
          loginctl show-user nayte -p UID -p State -p Linger -p RuntimePath 2>&1 || true

          echo "== listening TCP sockets (no process argv) =="
          ss -ltn 2>/dev/null || true
